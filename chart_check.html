main{padding:20px 24px;max-width:980px}
h2{font-size:20px;margin:0 0 4px}.lvl{color:var(--mute);font-size:13px;margin-bottom:12px}
.hint{background:#fff8e1;border:1px solid #ecdca0;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
textarea{width:100%;height:150px;font:12px/1.4 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
#chart{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px;min-height:120px;overflow:auto;margin:10px 0}
#err{color:var(--bad);font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace}
#info{color:var(--mute);font-size:13px}
.out button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
.bar{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
label{font-size:13px;color:var(--mute);display:block;margin:10px 0 4px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}aside{position:static;max-height:260px}}
